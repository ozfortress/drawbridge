name: drawbridge-v2-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawbridge
      POSTGRES_PASSWORD: drawbridge
      POSTGRES_DB: drawbridge
    ports:
      # 5433 on the host so the Citadel dev database keeps 5432 (05-delivery §1)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbridge -d drawbridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drawbridge
      MINIO_ROOT_PASSWORD: drawbridge
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_dev:/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      RUN_MODE: all
      DATABASE_URL: postgres://drawbridge:drawbridge@postgres:5432/drawbridge
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: drawbridge
      S3_SECRET_ACCESS_KEY: drawbridge
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: drawbridge
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
      NODE_ENV: development
    env_file:
      - ../.env.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_dev:
  minio_dev:
