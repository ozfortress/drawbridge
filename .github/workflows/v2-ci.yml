name: ci

on:
  push:
    branches: [drawbridge-v2]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
  pull_request:
    branches: [drawbridge-v2, main]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: v2

env:
  CI: "true"

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: v2
          file: v2/deploy/Dockerfile
          push: false
          load: true
          tags: drawbridge-v2:ci
